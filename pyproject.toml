[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "select-markets-explorer"
version = "0.2.0"
requires-python = ">=3.11"
[project.optional-dependencies]
dev = ["ruff>=0.8,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff.lint]
select = ["E4","E7","E9","F"]
